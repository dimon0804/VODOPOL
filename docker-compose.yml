services:
  vodopol:
    build: .
    container_name: vodopol
    ports:
      - "8000:8000"
    volumes:
      # Комплекты запусков и веса подключаются снаружи: образ пересобирать не нужно.
      # outputs подключён на запись: панель умеет собирать новый комплект сама,
      # и складывать его результат ей некуда, если том только для чтения.
      - ./outputs:/app/outputs
      - ./models:/app/models:ro
      # Отчёты модели — для страницы «Методы и качество»: панель показывает их как есть.
      - ./reports:/app/reports:ro
      # Данные нужны только для подложки S1 на карте.
      # На запись: сборка из панели сама докачивает слои чипа, которого ещё нет.
      - ./data/cache:/app/data/cache
    environment:
      # Конкретный комплект; без переменной сервис берёт свежий из outputs.
      # По умолчанию открываем демонстрационный комплект, а не просто свежий:
      # иначе панель показала бы последний собранный прогон, а жюри ждёт India.
      FLOODVALUE_RUN: ${FLOODVALUE_RUN:-outputs/20260926-India_900498-b6000}
    restart: unless-stopped
