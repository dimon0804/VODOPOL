# Обратный прокси для «Водополя» на vodopol.clv-digital.tech
#
# Контейнер слушает только на локальном адресе, наружу его отдаёт nginx. Так у
# приложения не появляется забот про TLS и сертификаты, а у сервера остаётся
# один вход на 443 порт.
#
# Ставится так:
#   sudo cp deploy/nginx-vodopol.conf /etc/nginx/sites-available/vodopol
#   sudo ln -sf /etc/nginx/sites-available/vodopol /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vodopol.clv-digital.tech
#
# Certbot сам допишет сюда блок с сертификатом и перенаправление с 80 порта.

server {
    listen 80;
    listen [::]:80;
    server_name vodopol.clv-digital.tech;

    # Панель только читает готовый комплект, поэтому минутных запросов, как у
    # «Фенолога», здесь нет. Запас всё же нужен: отрисовка слоя неопределённости
    # разворачивает растр под мегабайт в PNG, и на холодном старте первый запрос
    # заметно дольше остальных. Дальше слои отдаются из кэша в памяти.
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Каталог зон съёмки — это GeoJSON на десятки килобайт, сравнение стратегий и
    # таблица чувствительности тоже текстовые. Всё это жмётся в разы.
    # Слои карты и архив комплекта не трогаем: PNG и ZIP уже сжаты, повторное
    # сжатие только греет процессор.
    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # Тел запроса у панели нет: все ручки на чтение, бюджет приходит в строке
    # запроса. Потолок оставлен маленьким осознанно.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;

        # Настоящий адрес посетителя и схема: без них сервис в логах видит
        # только localhost, а ссылки в ответах получаются http вместо https.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Заголовок X-Bounds у слоёв карты обязателен: без него Leaflet не знает,
        # куда положить картинку, и карта остаётся пустой. Свои заголовки ответа
        # nginx пробрасывает сам, поэтому ничего объявлять не нужно — но именно
        # поэтому его нельзя случайно вырезать фильтром заголовков.
        proxy_buffering off;
    }
}
